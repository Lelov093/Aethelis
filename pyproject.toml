[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aethelis"
version = "0.1.0"
description = "A world-state governed multi-agent runtime for self-evolving AI-native virtual worlds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyjwt[crypto]>=2.10,<3",
    "PyYAML>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
    "volcengine-python-sdk[ark]>=5.0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.1,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
aethelis = "aethelis.cli.app:app"
aethelis-api = "aethelis.api.bootstrap:main"
aethelis-worker = "aethelis.product.worker_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aethelis"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
