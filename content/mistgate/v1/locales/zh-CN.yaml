world.mistgate.name: 雾门档案城
player.summary: 一名刚抵达雾门城、尚未获得任何特权的外来调查者。

action.move: 前往
action.observe: 观察现场
action.investigate: 调查周围
action.inspect_resource: 仔细检查
action.ask_character: 交谈
action.advance_world: 等待世界推进
action.ask_world: 询问世界
action.negotiate_resource: 协商资源
action.repair_regulator: 推进调节器修复
action.break_commitment: 违背修理承诺
action.request_calibration_key: 请求移交校准钥匙
action.validate_gate_lens: 验证闸门透镜
action.stabilize_regulator: 完成调节器校准
action.wait_for_world_response: 等待城中各方回应
dialogue.selka.parts.label: 向塞尔卡询问稳定器零件
dialogue.selka.parts.response: 塞尔卡压低声音说：“零件确实紧张，而且都要经过集市的行会渠道。先证明你的修理方案不是空谈，我们再谈下一步。”
dialogue.selka.parts.knowledge: 稳定器零件供应有限，主要集中在集市街。
dialogue.nara.key.label: 向娜拉询问校准钥匙传闻
dialogue.nara.key.response: 娜拉提醒你：“有人说钥匙曾经过集市，但这只是低可信的传闻。我没有证据，也不会把它说成事实。”
dialogue.nara.key.knowledge: 有一则低可信传闻声称校准钥匙曾经过集市街；该说法尚未验证。
exchange.selka.parts.label: 接受修理承诺并领取一组零件
exchange.selka.parts.response: 塞尔卡划出一组稳定器零件：“我先把这一组交给你。作为交换，你要带回足以证明修理确实推进的证据。”
exchange.selka.parts.commitment: 向塞尔卡提供能够证明黎明调节器修理已实际推进的证据。
repair.regulator.label: 使用稳定器零件压制调节器失稳
repair.regulator.response: 你将稳定器零件嵌入调节器的应急旁路。震动逐渐减弱，雾压暂时受到控制；这还不是彻底修复，但城市获得了继续行动的时间。
repair.regulator.knowledge: 黎明调节器的失稳压力已被暂时控制，城市进入可以继续推进修复的稳定状态。
commitment.selka.break.label: 告知塞尔卡你不会履行修理证据承诺
commitment.selka.break.response: 塞尔卡收起账册：“零件已经交到你手里。既然你选择不履行承诺，这笔失信也会被记下来。”
progression.key.label: 请伊沃打开保险柜并移交校准钥匙
progression.key.response: 伊沃核对了你发现的保险柜线索，亲自解除锁扣，把校准钥匙交到你手中。
progression.key.knowledge: 伊沃已依法打开工坊保险柜，校准钥匙现由你保管。
progression.lens.label: 用闸门透镜校验修复读数
progression.lens.response: 透镜上的刻度与调节器脉冲完全对齐，最终校准窗口已经确认。
progression.lens.knowledge: 闸门透镜验证了黎明调节器的安全校准窗口。
progression.final.label: 使用校准钥匙完成黎明调节器修复
progression.final.response: 校准钥匙锁入核心槽位，透镜读数稳定下来。黎明调节器重新进入可靠运行状态。
progression.final.knowledge: 黎明调节器已经完成最终校准并恢复稳定运行。
world_response.wait.label: 留在水道，等待消息传回
world_response.fulfilled.response: 稍后，塞尔卡让行会搬来后续维护物资。你履行了承诺，她也把这次修复纳入了城市的长期供应安排。
world_response.broken.response: 稍后，塞尔卡的回信抵达水道：调节器虽然修好了，但行会将撤回后续支援，并把你的失约记录留在账册上。

onboarding.arrival.title: 抵达雾门
onboarding.arrival.description: 观察议会广场，了解这座城市眼下最紧迫的问题。
onboarding.rowan.title: 认识守卫队长
onboarding.rowan.description: 留意广场上的罗文·凯斯特，以及他正在维护的通行秩序。
onboarding.first_lead.title: 选择第一条线索
onboarding.first_lead.description: 在档案馆、集市、工坊巷与旧水道之间选择你的第一处调查方向。

location.central_archive.name: 中央档案馆
location.central_archive.summary: 封存着市政记录和受限维修卷宗的高大档案厅。
location.central_archive.accessibility: 中央档案馆地点，安静的室内档案区域。
location.council_square.name: 议会广场
location.council_square.summary: 公告、警戒和维修许可汇集的公共广场，也是外来者抵达雾门的第一站。
location.council_square.accessibility: 议会广场地点，开阔且有人群活动的公共区域。
location.market_row.name: 集市街
location.market_row.summary: 稳定器零件与信用在压力下流通的繁忙商街。
location.market_row.accessibility: 集市街地点，商贩密集且声音嘈杂。
location.workshop_lane.name: 工坊巷
location.workshop_lane.summary: 聚集维修铺、伊沃工作台与一只上锁保险柜的狭长街巷。
location.workshop_lane.accessibility: 工坊巷地点，道路狭窄并有机械作业声。
location.old_aqueduct.name: 旧水道
location.old_aqueduct.summary: 暴露着黎明调节器校准组件的危险旧水工设施。
location.old_aqueduct.accessibility: 旧水道地点，潮湿、昏暗且存在设备危险。

character.mira.name: 米拉·维尔
character.mira.summary: 正在档案记录中寻找维修线索的档案员。
character.mira.accessibility: 米拉·维尔，档案员，通常位于中央档案馆。
character.rowan.name: 罗文·凯斯特
character.rowan.summary: 在议会广场控制城市通行的守卫队长。
character.rowan.accessibility: 罗文·凯斯特，守卫队长，通常位于议会广场。
character.selka.name: 塞尔卡·奥林
character.selka.summary: 在资源短缺中维护商会利益的行会代理人。
character.selka.accessibility: 塞尔卡·奥林，商会代理人，通常位于集市街。
character.ivo.name: 伊沃·雷恩
character.ivo.summary: 熟悉调节器结构并能合法检查自己工坊的维修技师。
character.ivo.accessibility: 伊沃·雷恩，维修技师，通常位于工坊巷。
character.nara.name: 娜拉·维伊
character.nara.summary: 追踪市场传言、却没有权力宣布事实的消息贩子。
character.nara.accessibility: 娜拉·维伊，市场消息贩子，通常位于集市街。
character.taren.name: 塔伦·索尔
character.taren.summary: 在旧水道监测黎明调节器症状的勘测员。
character.taren.accessibility: 塔伦·索尔，水道勘测员，通常位于旧水道。

resource.calibration_key.name: 校准钥匙
resource.calibration_key.summary: 稳定黎明调节器所需的真正钥匙。
resource.calibration_key.accessibility: 一件黄铜校准工具，属于关键物品。
resource.stabilizer_parts.name: 稳定器零件
resource.stabilizer_parts.summary: 由商会控制、供应紧张的维修材料。
resource.stabilizer_parts.accessibility: 一组用于设备维修的稀缺机械零件。
resource.gate_lens.name: 闸门透镜
resource.gate_lens.summary: 验证高风险调节器维修是否安全所需的透镜。
resource.gate_lens.accessibility: 一枚带刻度的光学机械透镜。
resource.market_credit.name: 市场信用
resource.market_credit.summary: 商会用来交换维修准入和零件的可协商信用。
resource.market_credit.accessibility: 代表商会交易额度的记账凭证。

entity.harmonic_tuner.name: 谐波调谐器
entity.harmonic_tuner.summary: 记录黎明调节器不稳定信号的档案馆侧调谐设备。
entity.harmonic_tuner.accessibility: 一台带有振动刻度和微光指针的调谐设备。
entity.dawn_regulator.name: 黎明调节器
entity.dawn_regulator.summary: 正在失稳、必须在雾压恶化前修复的城市核心设备。
entity.dawn_regulator.accessibility: 一座大型黄铜调节装置，表面有不稳定的光与振动。
entity.workshop_safe.name: 工坊保险柜
entity.workshop_safe.summary: 伊沃工坊中一只上锁、只能依法检查的保险柜。
entity.workshop_safe.accessibility: 一只带复杂机械锁的沉重保险柜。

canon.dawn_regulator_unstable: 黎明调节器正处于不稳定状态，需要尽快维修。
canon.tuner_records: 谐波调谐器会记录来自黎明调节器的不稳定信号。
canon.stabilizer_parts_limited: 稳定器零件数量有限，主要集中在集市街。
canon.council_permissions: 议会广场公开处理维修许可与守卫通行权。

asset.scene.council_square: 斜俯视的议会广场，玩家角色位于前景，罗文守在公告与警戒线附近。
asset.scene.central_archive: 高大而雾蓝的档案厅，书架与黄铜调谐器形成清晰层次。
asset.scene.market_row: 被暖色灯布与机械零件摊位包围的拥挤集市街。
asset.scene.workshop_lane: 狭长工坊巷，维修灯、管线和上锁保险柜构成视觉焦点。
asset.scene.old_aqueduct: 潮湿旧水道中的黎明调节器，雾与不稳定光线提示危险。
asset.portrait.mira: 米拉的半身肖像，档案员服装，神情专注而带有不确定感。
asset.portrait.rowan: 罗文的半身肖像，守卫队长制服，姿态克制而警觉。
asset.portrait.selka: 塞尔卡的半身肖像，商会服饰，神情精明而有所保留。
asset.portrait.ivo: 伊沃的半身肖像，维修技师服装，手边带有精密工具。
asset.portrait.nara: 娜拉的半身肖像，轻便市场服饰，目光敏锐且善于观察。
asset.portrait.taren: 塔伦的半身肖像，水道勘测装备，带有潮湿与工作磨损痕迹。
asset.detail.regulator: 黎明调节器调查近景，突出黄铜校准结构、透镜槽与失稳光线。

opportunity.archive.title: 查阅旧维修记录
opportunity.archive.description: 中央档案馆也许能说明调节器需要什么，但档案不等于钥匙本身。
opportunity.market.title: 追踪稀缺零件
opportunity.market.description: 集市街公开承认零件短缺，商会的交易条件可能决定维修能否推进。
opportunity.workshop.title: 查明校准钥匙去向
opportunity.workshop.description: 工坊巷的保险柜与伊沃掌握的维修线索可以独立于零件调查先行推进。
opportunity.aqueduct.title: 检查失稳信号
opportunity.aqueduct.description: 旧水道的设备症状能验证危险程度，却也可能让你过早暴露在风险中。

recovery.repair_access: 已取得稳定器零件；前往旧水道对黎明调节器实施第一阶段维修，以解除最终校准阻塞。
recovery.missing_parts: 若缺少稳定器零件，可在集市街调查供应与商会条件，而不是让世界陷入死锁。
recovery.missing_key: 最终校准缺少校准钥匙；前往工坊巷调查保险柜，并请伊沃依法交付。
recovery.missing_lens: 最终校准缺少经验证的闸门透镜读数；在旧水道调查并验证当地透镜。

outcome.stabilized.title: 黎明重新稳定
outcome.stabilized.description: 钥匙、零件与验证条件齐备后，调节器被安全修复，雾门获得了喘息时间。
outcome.continuation.title: 城市暂时守住了
outcome.continuation.description: 危机尚未彻底结束，但压力受到控制，各方仍在行动，世界可以继续发展。

journal.arrival: 你以外来调查者的身份抵达议会广场，没有权力直接决定城市的真相。
journal.regulator: 公告确认黎明调节器正在恶化，但维修所需条件仍不完整。
journal.first_choice: 档案、交易、工坊与旧水道提供了不同线索；第一步会影响你先遇见谁。
